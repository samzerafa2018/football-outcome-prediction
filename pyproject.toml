[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-outcome-prediction"
version = "0.1.0"
description = "Pre-match football outcome probabilities"
requires-python = ">=3.13,<3.14"
dependencies = [ "scikit-learn==1.9.1"]
[project.optional-dependencies]
dev = [
     "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
     "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
