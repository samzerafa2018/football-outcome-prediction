[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-outcome-prediction"
version = "0.1.0"
description = "Pre-match football outcome probabilities"
requires-python = ">=3.13,<3.14"
dependencies = []
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]